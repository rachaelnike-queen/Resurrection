<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>FBP Resurrection OS</title>

  <style>

    body {
      margin: 0;
      padding: 40px;
      background: #0d0d0d;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.4rem;
      letter-spacing: 2px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .upload-btn,
    .toolbar button {

      background: #1f1f1f;
      color: white;
      border: 1px solid #333;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: .9rem;
    }

    .upload-btn:hover,
    .toolbar button:hover {

      background: #2a2a2a;

    }

    #app {

      display: grid;
      grid-template-columns:
      repeat(auto-fill, minmax(320px, 1fr));

      gap: 24px;

    }

    .card {

      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0,0,0,.35);

    }

    .card h2 {

      margin-top: 0;
      color: #d8c3c3;
      font-size: 1.1rem;

    }

    .sold {

      color: #ff7d7d;

    }

    .active {

      color: #8dffb3;

    }

    .action-buttons {

      display: flex;
      gap: 10px;
      margin-top: 18px;

    }

    .relist-btn,
    .sold-btn {

      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .8rem;
      font-weight: bold;

    }

    .relist-btn {

      background: #4b3b24;
      color: #ffd27d;

    }

    .sold-btn {

      background: #3a1d1d;
      color: #ff8c8c;

    }

  </style>

</head>

<body>

  <h1>🦇 FBP Resurrection OS</h1>

  <div class="toolbar">

    <label class="upload-btn">

      Upload Vendoo CSV

      <input
        type="file"
        id="csvFile"
        accept=".csv"
        hidden
      />

    </label>

    <button id="showAllBtn">
      All Listings
    </button>

    <button id="showSoldBtn">
      Sold
    </button>

    <button id="showHeroBtn">
      Hero
    </button>

    <button id="showRelistBtn">
      Relist Today
    </button>

  </div>

  <div id="app"></div>

  <script>

    let D = [];

    function detectStyleWorld(title = "") {

      const t = title.toLowerCase();

      if (
        t.includes("velvet") ||
        t.includes("lace")
      ) return "Velvet Funeral";

      if (
        t.includes("office") ||
        t.includes("blazer")
      ) return "Goth Corp";

      if (
        t.includes("prairie") ||
        t.includes("floral")
      ) return "Laura Ashley Bloom";

      if (
        t.includes("overall")
      ) return "Overall Girl Utility";

      return "Black Poppy Archive";

    }


    function detectCoreAesthetic(title = "") {

      const t = title.toLowerCase();

      if (t.includes("goth"))
        return "Gothcore";

      if (
        t.includes("office") ||
        t.includes("blazer")
      )
        return "Corpcore";

      if (
        t.includes("lace")
      )
        return "Romantic Goth";

      if (
        t.includes("prep")
      )
        return "Preppy Noir";

      return "Archivecore";

    }


    function calculateHeroScore(title = "") {

      const t = title.toLowerCase();

      let score = 0;

      const heroTerms = [

        "velvet",
        "lace",
        "corset",
        "floral",
        "goth",
        "mesh",
        "leather",
        "blazer",
        "overall"

      ];

      heroTerms.forEach(term => {

        if (t.includes(term)) {
          score++;
        }

      });

      return score;

    }


    function detectSoldStatus(item) {

      const status =
        (
          item.Status ||
          item.status ||
          ""
        ).toLowerCase();

      return status.includes("sold");

    }


    function detectRelistStatus(item) {

      return (
        !item.isSold &&
        item.heroScore >= 2
      );

    }


    function processInventoryItem(item) {

      item.autoStyleWorld =
        detectStyleWorld(item.t);

      item.autoCore =
        detectCoreAesthetic(item.t);

      item.heroScore =
        calculateHeroScore(item.t);

      item.isSold =
        detectSoldStatus(item);

      item.needsRelist =
        detectRelistStatus(item);

    }


    document
      .getElementById("csvFile")
      .addEventListener("change", handleCSVUpload);


    function handleCSVUpload(event) {

      const file =
        event.target.files[0];

      if (!file) return;

      const reader =
        new FileReader();

      reader.onload = function(e) {

        parseCSV(e.target.result);

      };

      reader.readAsText(file);

    }


    function parseCSV(csvText) {

      const lines =
        csvText.split("\n");

      const headers =
        lines[0]
          .split(",")
          .map(h => h.trim());

      D = [];

      for (let i = 1; i < lines.length; i++) {

        const row =
          lines[i].split(",");

        if (row.length < 2) continue;

        const item = {};

        headers.forEach((header, index) => {

          item[header] =
            row[index]?.trim() || "";

        });

        item.t =

          item["Custom Title"] ||

          item["Listing Title"] ||

          item["Title"] ||

          item["title"] ||

          item["Name"] ||

          item["Product Name"] ||

          item["Item Title"] ||

          "Untitled Listing";


        processInventoryItem(item);

        D.push(item);

      }

      renderInventory(D);

    }


    function renderInventory(items) {

      const app =
        document.getElementById("app");

      app.innerHTML = "";

      items.forEach(item => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.innerHTML = `

          <h2>${item.t}</h2>

          <p>
            <strong>Style World:</strong>
            ${item.autoStyleWorld}
          </p>

          <p>
            <strong>Core:</strong>
            ${item.autoCore}
          </p>

          <p>
            <strong>Hero Score:</strong>
            ${item.heroScore}
          </p>

          <p>

            <strong>Status:</strong>

            <span class="${
              item.isSold
                ? 'sold'
                : item.wasRelisted
                  ? 'active'
                  : 'active'
            }">

              ${
                item.isSold
                  ? 'SOLD'
                  : item.wasRelisted
                    ? 'RELISTED'
                    : 'ACTIVE'
              }

            </span>

          </p>

          <div class="action-buttons">

            <button
              class="relist-btn"
              onclick="markRelisted('${item.t}')">

              Relisted

            </button>

            <button
              class="sold-btn"
              onclick="markSold('${item.t}')">

              Sold

            </button>

          </div>

        `;

        app.appendChild(card);

      });

    }


    function markRelisted(title) {

      const item =
        D.find(i => i.t === title);

      if (!item) return;

      item.wasRelisted = true;

      renderInventory(D);

    }


    function markSold(title) {

      const item =
        D.find(i => i.t === title);

      if (!item) return;

      item.isSold = true;

      renderInventory(D);

    }


    document
      .getElementById("showAllBtn")
      .addEventListener("click", () => {

        renderInventory(D);

      });


    document
      .getElementById("showSoldBtn")
      .addEventListener("click", () => {

        const sold =
          D.filter(i => i.isSold);

        renderInventory(sold);

      });


    document
      .getElementById("showHeroBtn")
      .addEventListener("click", () => {

        const hero =
          D.filter(i => i.heroScore >= 2);

        renderInventory(hero);

      });


    document
      .getElementById("showRelistBtn")
      .addEventListener("click", () => {

        const relist =
          D.filter(i => i.needsRelist);

        renderInventory(relist);

      });

  </script>

</body>

</html>
